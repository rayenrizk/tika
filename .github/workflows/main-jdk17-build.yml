name: main jdk17 build

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'

jobs:

  # TACHE 3 : Controle de securite avec Semgrep
  semgrep-security:
    name: Verification Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer Semgrep
        run: python -m pip install semgrep==1.185.0

      - name: Detecter les nouvelles vulnerabilites
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            BASE_SHA=$(git merge-base HEAD "$PR_BASE_SHA")
          else
            BASE_SHA=$(git rev-parse HEAD^)
          fi

          echo "Commit de reference : $BASE_SHA"

          semgrep scan \
            --config p/security-audit \
            --baseline-commit "$BASE_SHA" \
            --error \
            --json \
            --output semgrep-nouveaux.json \
            tika-core/src/main/java

      - name: Conserver le rapport Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-semgrep
          path: semgrep-nouveaux.json
          if-no-files-found: warn

  # Compilation Maven seulement si Semgrep reussit
  build:
    needs: semgrep-security
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Install external tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libimage-exiftool-perl

      
      - name: Build with Maven
        run: mvn clean apache-rat:check test install javadoc:aggregate -Pci -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"


  # Tests de bout en bout
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Run E2E Tests
        run: mvn -pl tika-e2e-tests -am clean verify -Pe2e -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
